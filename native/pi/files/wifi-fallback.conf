# wifi-fallback settings (installed as /etc/default/wifi-fallback by pi-setup).
# After a change: sudo systemctl restart wifi-fallback

IFACE=wlan0

# Setup access point. Empty SSID = WIFILT-setup-<end of MAC>.
# Empty password = open access point (anyone in range could change the Wi-Fi).
AP_SSID=
AP_PSK=
AP_CHANNEL=6

# AP_ADDR: the Pi on the access point network (WIFILT, SSH)
# PORTAL_ADDR: the setup portal; DNS on the access point sends every name here
AP_ADDR=192.168.4.1
PORTAL_ADDR=192.168.4.2
PORTAL_PORT=8090

# after boot: seconds to wait for a known network before the access point starts
BOOT_WAIT=40
# during operation: how long Wi-Fi may be disconnected before the access point starts
LOST_WAIT=120
# access point without a client: seconds until the known networks are tried again
RETRY_IDLE=300
