set -g default-terminal "tmux-256color"
set -g history-limit 10000
set -sg escape-time 10

# status bar: light grey, windows on the left, fslock and network on the right
set -g status-interval 2
set -g status-style "bg=#c0c0c0,fg=black"
set -g status-left ""
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-current-style "bg=#1e6b1e,fg=white"
set -g status-right-length 100
set -g status-right "#(/usr/local/bin/wifilt-tmux-status) "
