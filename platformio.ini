; WIFILT -- PlatformIO project for the ESP32 firmware.
;
; One source, two boards. The sketch (../wifilt.ino at the repo root) is shared
; byte-for-byte with the native build; here it is compiled for two ESP32 boards:
;
;   env:esp32    the RemoteQTH box -- generic ESP32-WROOM, the exact equivalent
;                of the old arduino-cli FQBN esp32:esp32:esp32.
;   env:m5atom   M5Stack Atom Lite (ESP32-PICO-D4, 4 MB). A bare-module build:
;                same firmware, band decoder auto-disabled at runtime (no HWid
;                divider), differing only in the status LED -- the Atom has no
;                plain LED on GPIO 5 but a single SK6812 RGB on GPIO 27, selected
;                by the WIFILT_M5ATOM_LITE build flag (see platform_caps.h).
;
; The native Linux/Windows/Raspberry Pi targets are NOT built here -- they stay
; on native/Makefile, which cross-compiles with mingw-w64 and aarch64-linux-gnu.

[platformio]
src_dir = .
default_envs = esp32, m5atom

[env]
; espressif32 6.5.0 bundles arduino-esp32 2.0.14 -- the core the firmware has
; always been pinned to (BUILD.md, the old CI FQBN). If a future PlatformIO ever
; renumbers this, pin the framework package directly instead:
;   platform_packages = platformio/framework-arduinoespressif32 @ ~3.20014.0
platform = espressif32@6.5.0
framework = arduino

; src_dir is the repo root, so build only the root-level sources -- the sketch,
; and any .cpp/.c a future refactor splits out of it. The patterns are top-level
; only, so native/, data/ and tools/ never leak in. (A bare +<wifilt.ino> does
; NOT work: PlatformIO converts the .ino to a .cpp first, and only the wildcard
; matches the converted name.) The root is on the include path automatically, so
; #include "platform_caps.h" and the other root headers resolve.
build_src_filter = +<*.ino> +<*.cpp> +<*.c>

; The custom 4 MB layout (two LittleFS partitions: cfg survives updates, spiffs
; holds the web assets). DIO because the RemoteQTH boards' Zbit clone flash will
; not boot a QIO image; harmless on the genuine Atom PICO.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.filesystem = littlefs

monitor_speed = 9600

; TrxNet lives in its own repository. PlatformIO fetches and compiles it in
; isolation from the sketch's defines, which is exactly what the ODR note in
; wifilt.ino requires (TrxNet.cpp must not see TRXNET_MAX_* from the sketch).
; The repo carries no version tags, so this tracks its default branch -- the
; same thing the CI native jobs' `git clone` has always done.
lib_deps = https://github.com/ok1hra/TrxNet.git

[env:esp32]
board = esp32dev

[env:m5atom]
board = m5stack-atom
build_flags = -D WIFILT_M5ATOM_LITE
