/* ── Mode: the one filter on this page that throws spots away ────────────────
   Every other filter here hides rows. This one refuses them at the door, so a
   500-row buffer spent on CW is not a buffer the one-in-a-hundred RTTY spot
   never gets into. Three consequences, all load-bearing:

   (1) It is NOT retroactive. Unticking RTTY does not purge the RTTY already in
       rows[], and ticking it back does not recover what was refused.
   (2) rows[] has THREE doors, not one -- addLine(), historyLoad() and the
       leader's seed. The test therefore lives in modeAdmitted() and every door
       calls it; miss one and the refused spots walk straight back in.
   (3) The policy is GLOBAL, unlike every other filter here. The others are
       per-instance because they are views. This one decides what the shared
       feed is allowed to become, and DXC_HISTORY_KEY is unprefixed for exactly
       the same reason -- a per-instance admission policy would let a CW-only
       pane overwrite the window's 30-minute backlog with a CW-only one.

/* The live table used to be bounded by traffic: at cluster pace 500 rows is a

   that tie -- RTTY-only at one-in-a-hundred fills 500 rows with eight hours of
   spots, nearly all of them long gone -- and a reload would then shrink the
   table twentyfold, because historyLoad() keeps only HISTORY_MAX_MIN. Same
   number here, so live and restored finally say the same thing.
   Unknown age counts as FRESH, deliberately. isSpotFreshEnoughToKeep() answers
   false for it, which is right for the cache and wrong here: the PC11 branch of
   parse() takes its time field without validating it, and such a row would
   vanish before it was ever drawn.

   is not age order: a cluster dumps its backlog on login, so an hour-old spot
   routinely lands at the NEWEST end, behind rows that are fresh. A front-walk
   would leave it there forever, which is the one case the cap exists for. */
/* ── Repeat suppression: one row per station, not one per skimmer ────────────

   buffer holds about three minutes, so the 30-minute age cap never even gets to
   apply, and the table is unreadable.

   is already there. That choice, rather than a plain discard, is what keeps the
   age cap honest: an active station's row keeps its time current and so never

   repeats still being suppressed, the loudest station on the band would vanish

   silence before this counts as a NEW appearance". While the station keeps

   index is DERIVED from rows[] rather than kept alongside it. That costs a walk
   of at most 500 rows per line -- nothing next to the full innerHTML rebuild

   outlive the row it points at: whatever removes the row (age, MAX, Clear, a

/* ── DX spot snapshot for the IP-rotator map ──────────────────────────────────
   The rotator's map used to open its OWN WebSocket on our port 82. That relay
   holds exactly one client (wifilt.ino:664), so the map and this page evicted
   each other -- and every eviction also tore down the cluster telnet login.
   Growing the relay to N slots was considered and rejected: ESP32 core 2.0.14
   WiFiClient::write() is a select() loop of 10 retries x 1 s, so one asleep
   laptop could block loop() for tens of seconds, and three clients would treble
   it. Two browser windows cannot talk directly either -- postMessage needs a
   window handle and BroadcastChannel is same-origin, partitioned by top-level
   site since Chrome 115.

   So the LEADER pushes a snapshot of the VISIBLE rows into the rotator's own
   firmware and the map reads it same-origin from there. Our relay never learns
   it happened and keeps its single slot for our own windows.

   Fire-and-forget by design. text/plain keeps this a simple request, so the
   rotator needs no CORS and no OPTIONS handler; no-cors means the response is
   opaque, which is fine because there is nothing in it we act on. Until the
   rotator grows the endpoint every POST fails silently and nothing here changes.

   Cadence is this timer, NOT render(): render runs on every cluster line, which
   on a live band is several a second. */

  if(!mapHost){mapEl.className="s n";mapEl.title="No rotator map configured (SETUP \u2192 DX Cluster)";return}
  if(linkRole!=="leader"){mapEl.className="s n";mapEl.title="Another DXC instance is feeding the rotator map";return}
  mapEl.className="s ok";mapEl.title="Feeding DX spots to the rotator map at "+mapHost}
function postSpotsToMap(){updateMapPill();
  if(!mapHost||linkRole!=="leader")return;

  for(i=0;i<src.length;i++){row=src[i].row||null;
    if(!row||!row.freq||!row.dx)continue;
    spots.push({dx:row.dx,freq:row.freq,type:row.type||"",time:row.time||""})}
  /* rows[] is oldest-first (push + shift), so the NEWEST are at the end. */
  if(spots.length>MAP_SPOT_MAX)spots=spots.slice(-MAP_SPOT_MAX);
  var body=JSON.stringify({telnet:!!telnetOn,spots:spots});
  try{fetch("http://"+mapHost+"/setDxcSpots",{method:"POST",mode:"no-cors",cache:"no-store",
    headers:{"Content-Type":"text/plain;charset=UTF-8"},body:body}).catch(function(){})}catch(e){}}

/* ── Bottom bar: one row unless asked otherwise ───────────────────────────────

   The bar carries fourteen controls and its natural width is ~1360px, so in the
   QRPlog split pane (280-900px) it has always wrapped. What was not obvious
   until it was measured in a real browser is how badly: 157px at 280px of pane,
   and 175px at 720-800px, because above the 700px breakpoint the bar did not
   wrap AT ALL and .hint collapsed to min-content, stacking its 68 characters
   into nine lines. The split's default fraction (0.42, log-dxc-split.js:44) puts
   a 1920px screen at ~806px -- dead centre of the worst band.

   Collapsed is 29px at every width. Everything outside the status row and the
   command prompt is .bar-more and simply display:none -- no clipping, no
   measuring, no reordering: the group is explicit, so the mechanism can be one
   CSS rule.

   Opening REFLOWS (the bar is a flex child, .wrap gives up the height) rather
   than overlaying the table, because the newest spots must stay readable. That
   costs the scroll anchor: .wrap keeps its scrollTop while losing height, so
   whatever sat at the bottom edge slides under it. scrollOutputsToBottom()
   cannot fix this on its own -- it starts with if(!autoScroll)return, and an
   operator who froze the list is exactly the one parked at its end. So the
   bottom is made sticky here instead, per output and independent of autoScroll;
   a view parked mid-list is left alone, since it has no "last row" to lose. */

var bar=document.getElementById("bar"),barToggle=document.getElementById("barToggle");
var barOpen=(function(){try{return localStorage[LS("BarOpen")]==="1"}catch(e){return false}})();

/* #cols was anchored at a hardcoded bottom:76px, which only ever matched one
   particular wrapped bar; with a collapsible one it has to follow the real
   height. The panel is opened from a .bar-more button, so the bar is always
   open when it appears -- but it can still be open at two, three or four rows
   depending on width, hence the recompute on resize as well. */
function positionCols(){
  if(!cols.classList.contains("on"))return;

}
function applyBarOpen(){
  var els=barScrollers(),atBottom=els.map(function(el){
    return el.scrollHeight-el.scrollTop-el.clientHeight<=2;
  });

  barToggle.title=barOpen?"Hide extra controls":"Show more controls";
  barToggle.setAttribute("aria-expanded",barOpen?"true":"false");

     so the correction lands on the new geometry, with no frame of delay. */
  els.forEach(function(el,i){if(atBottom[i])el.scrollTop=el.scrollHeight});
  if(!barOpen)cols.classList.remove("on");
  positionCols();
}
barToggle.onclick=function(){
