/* Jitter on EVERY election wait. Two instances deciding on the same tick both
   claim the socket and evict each other -- exactly the "transmitting over each
   other" failure that zero jitter in all 13 retry waits produced in Mercury's
   ARQ state machine, and it was fixed there the same way. */
function linkJitter(base){return base+Math.floor(Math.random()*150)}
function linkPost(m){if(!linkCh)return;m.id=linkId;try{linkCh.postMessage(m)}catch(e){}}

   schedules a reconnect and takes the socket straight back. */
function linkDropSocket(){clearTimeout(rtimer);rtimer=0;clearTimeout(loginTimer);
  if(ws){try{ws.onclose=null;ws.onerror=null;ws.onmessage=null;ws.close()}catch(e){}ws=null}}
function becomeLeader(){linkRole="leader";clearTimeout(linkWatchTimer);linkWatchTimer=0;
  clearTimeout(linkProbeTimer);linkProbeTimer=0;wsEl.title="";

  connect()}
function becomeFollower(){linkRole="follower";clearInterval(linkAliveTimer);linkAliveTimer=0;
  clearTimeout(linkProbeTimer);linkProbeTimer=0;linkDropSocket();

  linkPost({t:"hello"});linkWatch()}

  linkWatchTimer=setTimeout(function(){if(linkRole==="leader")return;
    if(Date.now()-linkSeen<LINK_DEAD_MS){linkWatch();return}
    startElection()},linkJitter(LINK_DEAD_MS))}

function linkOnMessage(ev){var m=ev.data;if(!m||!m.t||m.id===linkId)return;

    if(m.t==="probe"){linkPost({t:"leader"});return}
    if(m.t==="hello"){linkPost({t:"seed",to:m.id,rows:rows.slice(-MAX),raw:rawLines.slice(-LINK_SEED_RAW)});
      linkPost({t:"telnet",on:telnetOn});return}
    if(m.t==="cmd"){if(ws&&ws.readyState===1)ws.send(String(m.s||"")+"\r\n");return}
    /* Two leaders can only overlap for an instant. The lower id keeps the
       socket, the other stands down -- so the eviction loop never starts. */
    if((m.t==="leader"||m.t==="alive")&&linkId>m.id)becomeFollower();
    return}
  switch(m.t){
    case "leader":case "alive":
      linkSeen=Date.now();
      if(linkRole!=="follower")becomeFollower();
      break;
    case "seed":
      if(m.to!==linkId||!Array.isArray(m.rows))break;
      /* Merged, not assigned. This instance may already hold 30 minutes
         restored from the cache, and a leader that came up two minutes ago
         would otherwise wipe it the moment the election settled.
         The RAW view still takes the leader's copy wholesale: it is a window on
         the live telnet stream, identical lines in it repeat legitimately, so
         there is no key to dedupe on -- and taking it is exactly what a
         follower did before any of this existed. */
      linkSeen=Date.now();rows=mergeRowsByRaw(rows,m.rows);
      if(Array.isArray(m.raw)){rawLines=m.raw.slice(-LINK_SEED_RAW);raw.textContent=rawLines.join("\n")}
      render();historyScheduleSave();
      break;
    case "feed":
      linkSeen=Date.now();String(m.chunk||"").split(/\n/).forEach(addLine);
      break;
    case "telnet":
      linkSeen=Date.now();telnetOn=!!m.on;
      setClass(tnEl,telnetOn?"Telnet on":"Telnet off",telnetOn?"ok":"bad");
      break;
    case "resign":
      startElection();
      break}}
function linkStart(){try{linkCh=new BroadcastChannel(LINK_NAME)}catch(e){linkCh=null}

     instance, one socket, and the operator keeps one window open. */

  linkCh.onmessage=linkOnMessage;

/* ── Bottom bar: one row unless asked otherwise ───────────────────────────────

   The bar carries fourteen controls and its natural width is ~1360px, so in the
   QRPlog split pane (280-900px) it has always wrapped. What was not obvious
   until it was measured in a real browser is how badly: 157px at 280px of pane,
   and 175px at 720-800px, because above the 700px breakpoint the bar did not
   wrap AT ALL and .hint collapsed to min-content, stacking its 68 characters
   into nine lines. The split's default fraction (0.42, log-dxc-split.js:44) puts
   a 1920px screen at ~806px -- dead centre of the worst band.

   Collapsed is 29px at every width. Everything outside the status row and the
   command prompt is .bar-more and simply display:none -- no clipping, no
   measuring, no reordering: the group is explicit, so the mechanism can be one
   CSS rule.

   Opening REFLOWS (the bar is a flex child, .wrap gives up the height) rather
   than overlaying the table, because the newest spots must stay readable. That
   costs the scroll anchor: .wrap keeps its scrollTop while losing height, so
   whatever sat at the bottom edge slides under it. scrollOutputsToBottom()
   cannot fix this on its own -- it starts with if(!autoScroll)return, and an
   operator who froze the list is exactly the one parked at its end. So the
   bottom is made sticky here instead, per output and independent of autoScroll;
   a view parked mid-list is left alone, since it has no "last row" to lose. */

var bar=document.getElementById("bar"),barToggle=document.getElementById("barToggle");
var barOpen=(function(){try{return localStorage[LS("BarOpen")]==="1"}catch(e){return false}})();
function barScrollers(){return [document.querySelector(".wrap"),raw,histogram].filter(Boolean)}
/* #cols was anchored at a hardcoded bottom:76px, which only ever matched one
   particular wrapped bar; with a collapsible one it has to follow the real
   height. The panel is opened from a .bar-more button, so the bar is always
   open when it appears -- but it can still be open at two, three or four rows
   depending on width, hence the recompute on resize as well. */
function positionCols(){
  if(!cols.classList.contains("on"))return;
  cols.style.bottom=(bar.offsetHeight+6)+"px";
}
function applyBarOpen(){
  var els=barScrollers(),atBottom=els.map(function(el){
    return el.scrollHeight-el.scrollTop-el.clientHeight<=2;
  });
  bar.classList.toggle("collapsed",!barOpen);
  barToggle.textContent=barOpen?"▼":"▲";
  barToggle.title=barOpen?"Hide extra controls":"Show more controls";
  barToggle.setAttribute("aria-expanded",barOpen?"true":"false");
  /* Reading scrollHeight forces the layout the class change just invalidated,
     so the correction lands on the new geometry, with no frame of delay. */
  els.forEach(function(el,i){if(atBottom[i])el.scrollTop=el.scrollHeight});
  if(!barOpen)cols.classList.remove("on");
  positionCols();
}
barToggle.onclick=function(){
  barOpen=!barOpen;
  try{localStorage[LS("BarOpen")]=barOpen?"1":"0"}catch(e){}
  applyBarOpen();
};
addEventListener("resize",positionCols);
applyBarOpen();
