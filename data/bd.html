<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Band Decoder — WIFILT</title>
  <link rel="stylesheet" href="/cat.css?v=d651e040">
  <style>
    .bd-shell {
      width: min(960px, calc(100vw - 24px));
      margin: 24px auto 40px;
    }
    .bd-card {
      background: #0d1116;
      border: 1px solid #1f2731;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      padding: 20px 24px;
    }
    .bd-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .bd-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .bd-btn-sec {
      padding: 5px 14px;
      border-radius: 8px;
      border: 1px solid #1f2731;
      background: #0d1116;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .bd-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .bd-toolbar label { font-weight: 600; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .bd-toolbar select {
      width: 160px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #1f2731;
      background: #07090b;
      color: var(--text);
      font-size: 13px;
    }
    .bd-status { font-size: 13px; color: var(--muted); }
    .bd-wrap { overflow-x: auto; }
    table.bd-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }
    .bd-table th, .bd-table td {
      border: 1px solid #1f2731;
      padding: 4px 6px;
      text-align: center;
      white-space: nowrap;
      color: var(--text);
    }
    .bd-table th {
      background: #07090b;
      font-weight: 700;
      color: var(--muted);
    }
    .bd-outputs-header {
      background: #07090b !important;
      color: var(--muted) !important;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.1em;
    }
    .bd-table input[type=number] {
      width: 72px;
      border: 1px solid #1f2731;
      border-radius: 4px;
      padding: 2px 4px;
      background: #07090b;
      color: var(--text);
      text-align: right;
      font-size: 12px;
    }
    .bd-table input[type=checkbox] { accent-color: var(--blue); }
    .bd-cell-green { background: #003a00 !important; }
    .bd-cell-green input { background: transparent !important; color: #7eff66 !important; }
    .bd-cell-red { background: #3a0000 !important; }
    .bd-cell-red input { background: transparent !important; color: #ff6666 !important; }
    .bd-col-header.bd-active { background: #3a0000 !important; color: #ff6666 !important; }
  </style>
</head>
